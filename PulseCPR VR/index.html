<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseCPR — WebXR CPR Training</title>
  <!-- Google Fonts & A-Frame -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    /* Glassmorphism HUD Dashboard */
    #ui-container {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      width: 90%;
      max-width: 360px;
    }

    .hud-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 20px 24px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hud-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .bpm-wrapper {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      margin: 6px 0;
    }

    .bpm-value {
      font-size: 54px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .bpm-unit {
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 99px;
      margin-top: 8px;
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Dynamic Status Colors */
    .status-idle { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.2); }
    .status-good { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); box-shadow: 0 0 20px rgba(34, 197, 94, 0.2); }
    .status-warning { background: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-bad { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }

    .timer-bar-container {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.08);
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
    }

    .timer-progress {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 99px;
      transition: width 1s linear;
    }

    .timer-text {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* Score Modal Overlay */
    #score-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #score-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
      padding: 36px 28px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .score-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 4px;
    }

    .result-badge {
      font-size: 14px;
      font-weight: 700;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .btn-action {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.5);
    }
  </style>
</head>
<body>

  <!-- UI Overlay Interface -->
  <div id="ui-container">
    <div id="hud" class="hud-card">
      <div class="hud-header">Ritmi Aktual</div>
      <div class="bpm-wrapper">
        <div id="bpm-display" class="bpm-value">0</div>
        <div class="bpm-unit">BPM</div>
      </div>
      <div id="status-display" class="status-badge status-idle">
        <span class="status-dot"></span>
        <span>Shtyp SPACEBAR / Prek ekranin</span>
      </div>
      
      <div class="timer-bar-container">
        <div id="timer-progress" class="timer-progress"></div>
      </div>
      <div id="timer-text" class="timer-text">Koha: 15 sekonda</div>
    </div>
  </div>

  <!-- Score Modal Screen -->
  <div id="score-modal">
    <div id="score-card">
      <div class="score-title">Përmbledhja e Sesionit</div>
      
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-label">BPM Mesatare</div>
          <div id="final-bpm" class="stat-val">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Saktësia</div>
          <div id="final-accuracy" class="stat-val">0%</div>
        </div>
      </div>

      <div id="final-status" class="result-badge status-good">
        CPR Sukses — Ritëm Efektiv
      </div>

      <button class="btn-action" onclick="resetSession()">Provo Përsëri</button>
    </div>
  </div>

  <!-- 3D WebXR Scene (A-Frame) -->
  <a-scene embedded vr-mode-ui="enabled: false">
    <!-- Lights -->
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" position="-1 3 2" intensity="0.9"></a-light>

    <!-- Camera / Viewport -->
    <a-entity position="0 1.4 1.8" rotation="-22 0 0">
      <a-camera look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>
    </a-entity>

    <!-- Room / Floor -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#0f172a"></a-plane>

    <!-- Table Bed -->
    <a-box position="0 0.4 -0.5" width="1.6" height="0.8" depth="1.1" color="#1e293b"></a-box>

    <!-- Mannequin Target -->
    <a-entity id="mannequin" position="0 0.8 -0.5">
      <!-- Chest Compression Target -->
      <a-box id="chest" position="0 0.1 0" width="0.6" height="0.2" depth="0.8" color="#38bdf8"></a-box>
      <!-- Head -->
      <a-sphere position="0 0.2 -0.5" radius="0.18" color="#e2e8f0"></a-sphere>
      <!-- Arms -->
      <a-box position="-0.38 0.08 0" width="0.12" height="0.15" depth="0.7" color="#475569"></a-box>
      <a-box position="0.38 0.08 0" width="0.12" height="0.15" depth="0.7" color="#475569"></a-box>
    </a-entity>

    <!-- 3D Text instruction -->
    <a-text value="Gjoksi ulet me cdo kompresion" 
            position="0 1.8 -1.2" align="center" color="#94a3b8" width="2.8"></a-text>

    <!-- Background Sky -->
    <a-sky color="#020617"></a-sky>
  </a-scene>

  <script>
    let pressTimestamps = [];
    let isSessionActive = false;
    let sessionDuration = 15;
    let remainingTime = sessionDuration;
    let timerInterval = null;
    let validCompressions = 0;
    let totalCompressions = 0;

    const bpmDisplay = document.getElementById('bpm-display');
    const statusDisplay = document.getElementById('status-display');
    const timerProgress = document.getElementById('timer-progress');
    const timerText = document.getElementById('timer-text');
    const scoreModal = document.getElementById('score-modal');
    const chestEntity = document.getElementById('chest');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 580, duration = 0.06) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function handleCompression() {
      if (!isSessionActive) startSession();

      const now = performance.now();
      pressTimestamps.push(now);
      totalCompressions++;

      pressTimestamps = pressTimestamps.filter(t => now - t <= 3000);

      // 3D Chest Animation
      chestEntity.setAttribute('position', '0 0.04 0');
      setTimeout(() => chestEntity.setAttribute('position', '0 0.1 0'), 90);

      playBeep();
      calculateBPM();
    }

    function calculateBPM() {
      if (pressTimestamps.length < 2) return;

      const intervals = [];
      for (let i = 1; i < pressTimestamps.length; i++) {
        intervals.push(pressTimestamps[i] - pressTimestamps[i - 1]);
      }
      const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
      const bpm = Math.round(60000 / avgInterval);

      bpmDisplay.textContent = bpm;

      if (bpm >= 100 && bpm <= 120) {
        statusDisplay.innerHTML = `<span class="status-dot"></span><span>Ritëm Optimal (100-120)</span>`;
        statusDisplay.className = "status-badge status-good";
        validCompressions++;
      } else if (bpm < 100) {
        statusDisplay.innerHTML = `<span class="status-dot"></span><span>Më shpejt! (&lt;100)</span>`;
        statusDisplay.className = "status-badge status-warning";
      } else {
        statusDisplay.innerHTML = `<span class="status-dot"></span><span>Më ngadalë! (&gt;120)</span>`;
        statusDisplay.className = "status-badge status-bad";
      }
    }

    function startSession() {
      isSessionActive = true;
      remainingTime = sessionDuration;
      validCompressions = 0;
      totalCompressions = 0;
      pressTimestamps = [];

      timerInterval = setInterval(() => {
        remainingTime--;
        const pct = (remainingTime / sessionDuration) * 100;
        timerProgress.style.width = pct + "%";
        timerText.textContent = `Koha: ${remainingTime} sekonda`;

        if (remainingTime <= 0) endSession();
      }, 1000);
    }

    function endSession() {
      isSessionActive = false;
      clearInterval(timerInterval);

      const avgBpm = bpmDisplay.textContent;
      const accuracy = totalCompressions > 0 
        ? Math.round((validCompressions / totalCompressions) * 100) 
        : 0;

      document.getElementById('final-bpm').textContent = avgBpm;
      document.getElementById('final-accuracy').textContent = accuracy + "%";

      const finalStatus = document.getElementById('final-status');
      if (accuracy >= 70) {
        finalStatus.textContent = "SUKSES: Ushtrim efektiv i CPR!";
        finalStatus.className = "result-badge status-good";
      } else {
        finalStatus.textContent = "NEVOJITET PROVË: Mbaj ritmin 100-120 BPM";
        finalStatus.className = "result-badge status-bad";
      }

      scoreModal.style.display = 'flex';
    }

    function resetSession() {
      scoreModal.style.display = 'none';
      bpmDisplay.textContent = "0";
      statusDisplay.innerHTML = `<span class="status-dot"></span><span>Shtyp SPACEBAR / Prek ekranin</span>`;
      statusDisplay.className = "status-badge status-idle";
      timerProgress.style.width = "100%";
      timerText.textContent = `Koha: ${sessionDuration} sekonda`;
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && scoreModal.style.display !== 'flex') {
        e.preventDefault();
        handleCompression();
      }
    });

    window.addEventListener('touchstart', (e) => {
      if (scoreModal.style.display !== 'flex' && e.target.tagName !== 'BUTTON') {
        handleCompression();
      }
    });
  </script>
</body>
</html>
